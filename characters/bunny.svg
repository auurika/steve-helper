<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <style>
    .bob{animation:bob 2.4s ease-in-out infinite;transform-origin:64px 118px}
    .ear{animation:ear 3s ease-in-out infinite;transform-origin:64px 52px}
    .blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes ear{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg)}}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
  </style>
  <ellipse cx="64" cy="118" rx="32" ry="6" fill="#000" opacity=".12"/>
  <g class="bob">
    <ellipse cx="64" cy="98" rx="26" ry="19" fill="#FFFFFF" stroke="#E4DDE8" stroke-width="2"/>
    <circle cx="100" cy="102" r="7" fill="#fff" stroke="#E4DDE8" stroke-width="2"/>
    <ellipse cx="44" cy="112" rx="10" ry="5" fill="#fff" stroke="#E4DDE8" stroke-width="2"/>
    <ellipse cx="84" cy="112" rx="10" ry="5" fill="#fff" stroke="#E4DDE8" stroke-width="2"/>
    <g class="ear">
      <ellipse cx="46" cy="22" rx="10" ry="26" fill="#fff" stroke="#E4DDE8" stroke-width="2" transform="rotate(-8 46 22)"/>
      <ellipse cx="46" cy="24" rx="5" ry="18" fill="#FFC1D3" transform="rotate(-8 46 24)"/>
      <ellipse cx="82" cy="22" rx="10" ry="26" fill="#fff" stroke="#E4DDE8" stroke-width="2" transform="rotate(8 82 22)"/>
      <ellipse cx="82" cy="24" rx="5" ry="18" fill="#FFC1D3" transform="rotate(8 82 24)"/>
    </g>
    <ellipse cx="64" cy="66" rx="36" ry="30" fill="#fff" stroke="#E4DDE8" stroke-width="2"/>
    <g class="blink"><ellipse cx="50" cy="64" rx="4.5" ry="6" fill="#3A2B3F"/><circle cx="51.5" cy="62" r="1.8" fill="#fff"/></g>
    <g class="blink"><ellipse cx="78" cy="64" rx="4.5" ry="6" fill="#3A2B3F"/><circle cx="79.5" cy="62" r="1.8" fill="#fff"/></g>
    <circle cx="40" cy="76" r="6" fill="#FFB3C6" opacity=".7"/>
    <circle cx="88" cy="76" r="6" fill="#FFB3C6" opacity=".7"/>
    <path d="M61 72 h6 l-3 4 z" fill="#F58BA6"/>
    <path d="M64 76 v3 M64 79 q-4 4 -8 1 M64 79 q4 4 8 1" fill="none" stroke="#3A2B3F" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
