<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <style>
    .bob{animation:bob 2.2s ease-in-out infinite;transform-origin:64px 118px}
    .led{animation:led 1.2s infinite}
    .blink{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes led{0%,100%{opacity:1}50%{opacity:.3}}
    @keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
  </style>
  <ellipse cx="64" cy="118" rx="30" ry="6" fill="#000" opacity=".12"/>
  <g class="bob">
    <path d="M64 24 V12" stroke="#7B8AA0" stroke-width="4" stroke-linecap="round"/>
    <circle class="led" cx="64" cy="10" r="5" fill="#FF5D6C"/>
    <rect x="22" y="48" width="8" height="20" rx="4" fill="#7B8AA0"/>
    <rect x="98" y="48" width="8" height="20" rx="4" fill="#7B8AA0"/>
    <rect x="42" y="88" width="44" height="26" rx="8" fill="#5B8DEF"/>
    <rect x="52" y="96" width="24" height="10" rx="3" fill="#CFE0FF"/>
    <rect x="28" y="92" width="14" height="8" rx="4" fill="#7B8AA0"/>
    <rect x="86" y="92" width="14" height="8" rx="4" fill="#7B8AA0"/>
    <rect x="28" y="24" width="72" height="62" rx="18" fill="#DDE6F5"/>
    <rect x="36" y="34" width="56" height="40" rx="12" fill="#1F2A44"/>
    <g class="blink"><rect x="46" y="46" width="10" height="14" rx="5" fill="#6CF0FF"/></g>
    <g class="blink"><rect x="72" y="46" width="10" height="14" rx="5" fill="#6CF0FF"/></g>
    <path d="M54 66 q10 7 20 0" fill="none" stroke="#6CF0FF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="34" cy="80" r="2.5" fill="#9AA9C2"/>
    <circle cx="94" cy="80" r="2.5" fill="#9AA9C2"/>
  </g>
</svg>
