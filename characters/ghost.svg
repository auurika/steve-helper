    @keyframes shadow{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.8)}}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
  </style>
  <ellipse class="shadow" cx="64" cy="118" rx="26" ry="5" fill="#000" opacity=".12"/>
  <g class="float">
