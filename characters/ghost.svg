    <g class="blink"><ellipse cx="50" cy="58" rx="6" ry="8" fill="#2B2B3A"/><circle cx="52" cy="55" r="2" fill="#fff"/></g>
    <g class="blink"><ellipse cx="78" cy="58" rx="6" ry="8" fill="#2B2B3A"/><circle cx="80" cy="55" r="2" fill="#fff"/></g>
    <ellipse cx="64" cy="76" rx="5" ry="6" fill="#2B2B3A"/>
    <circle cx="40" cy="72" r="6" fill="#FFB3D1" opacity=".7"/>
    <circle cx="88" cy="72" r="6" fill="#FFB3D1" opacity=".7"/>
    <path d="M28 70 q-10 8 -4 18" fill="none" stroke="#C9C0F2" stroke-width="3" stroke-linecap="round"/>
    <path d="M100 70 q10 8 4 18" fill="none" stroke="#C9C0F2" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
