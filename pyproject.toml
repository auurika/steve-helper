[project]
name = "steve"
version = "0.1.0"
description = "Офлайн голосовой помощник для macOS"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ollama>=0.4",
    "sounddevice>=0.5",
    "numpy>=1.26",
    "mlx-whisper>=0.4",
]

[project.scripts]
steve = "steve.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["steve"]
